<title>שנים מקרא</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one calm reading column on a paper ground; tablet widths open a second column for Targum/Rashi. */
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1c1b18; --muted:#6c6a64; --line:#e3e0d7;
  --accent:#2c4a7c; --accent-ink:#ffffff; --accent-soft:#e7ecf5;
  --rep-bg:#efede7; --rep-ink:#57544d; --tg-ink:#3b3a36; --hl:#f3e6b8; --parch:#fbf6e9; --parch-ink:#1a150d; --parch-line:#e8dfc8; --tfs:26px;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --fs:28px;
  --f-main:"TF","Times New Roman",serif; --f-tg:"TF","Times New Roman",serif; --f-rashi:"RASHI","TF",serif;
  --f-stam:"STAMA","TF",serif; --f-stamv:"STAMS","TF",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161c; --surface:#1b1f27; --ink:#ebe7de; --muted:#9a978f; --line:#2b313c;
  --accent:#a8bde6; --accent-ink:#13161c; --accent-soft:#232c3e;
  --rep-bg:#1d2129; --rep-ink:#b3afa6; --tg-ink:#d2cec4; --hl:#4a3f1c; --parch:#1e1b15; --parch-ink:#ece3cc; --parch-line:#332d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161c; --surface:#1b1f27; --ink:#ebe7de; --muted:#9a978f; --line:#2b313c;
  --accent:#a8bde6; --accent-ink:#13161c; --accent-soft:#232c3e;
  --rep-bg:#1d2129; --rep-ink:#b3afa6; --tg-ink:#d2cec4; --hl:#4a3f1c; --parch:#1e1b15; --parch-ink:#ece3cc; --parch-line:#332d22; color-scheme:dark}
/* the reader's own choice wins over the host theme */
:root[data-skin="light"]{--parch:#fbf6e9;--parch-ink:#1a150d;--parch-line:#e8dfc8;--bg:#f6f5f1;--surface:#fff;--ink:#1c1b18;--muted:#6c6a64;--line:#e3e0d7;--accent:#2c4a7c;--accent-ink:#fff;--accent-soft:#e7ecf5;--rep-bg:#efede7;--rep-ink:#57544d;--tg-ink:#3b3a36;--hl:#f3e6b8;color-scheme:light}
:root[data-skin="sepia"]{--parch:#f8efdb;--parch-ink:#22190c;--parch-line:#e0d2b4;--bg:#f2e9d8;--surface:#f8f1e3;--ink:#2a2116;--muted:#7a6b55;--line:#e0d3bb;--accent:#6b4a22;--accent-ink:#fff8ec;--accent-soft:#eadcc2;--rep-bg:#e9dec8;--rep-ink:#5f5240;--tg-ink:#3d3324;--hl:#e8cf8a;color-scheme:light}
:root[data-skin="dark"]{--parch:#1e1b15;--parch-ink:#ece3cc;--parch-line:#332d22;--bg:#13161c;--surface:#1b1f27;--ink:#ebe7de;--muted:#9a978f;--line:#2b313c;--accent:#a8bde6;--accent-ink:#13161c;--accent-soft:#232c3e;--rep-bg:#1d2129;--rep-ink:#b3afa6;--tg-ink:#d2cec4;--hl:#4a3f1c;color-scheme:dark}

html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.he{direction:rtl}

/* ---------- top bars ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.bar .title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.bar .title b{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .title span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[dir="rtl"] .flip svg,[dir="rtl"] .flipme{transform:scaleX(-1)}
[dir="ltr"] .arr{transform:scaleX(-1)}
.tog{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;flex:none}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);flex:none}
.seg button{border:0;background:none;padding:0 11px;height:38px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sizer{display:flex;align-items:center;gap:10px;padding-block:0 10px}
.sizer .a{font-family:var(--f-main);color:var(--muted);line-height:1;cursor:pointer;border:0;background:none;padding:4px 6px}
.sizer .a.s{font-size:17px}.sizer .a.l{font-size:27px}
.sizer input{flex:1;accent-color:var(--accent);min-width:0;height:28px}
.sizer output{font-size:12px;color:var(--muted);width:3.2em;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
#home .wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.langb{border-radius:50%;font-weight:700;font-size:13px;letter-spacing:.02em;color:var(--accent)}
.brand h1{margin:0;font-family:var(--f-main);font-weight:400;font-size:26px;line-height:1.2}
.brand small{display:block;font-family:var(--ui);font-size:12.5px;color:var(--muted);margin-top:2px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px}
.week .eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.week h2{margin:0;font-family:var(--f-main);font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1.1;direction:rtl}
.week .date{color:var(--muted);font-size:14px}
.go{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.go{grid-template-columns:1fr}}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;border-radius:16px;padding:16px 18px;cursor:pointer;border:1px solid var(--line);background:var(--bg)}
.big b{font-size:18px;font-weight:650}
.big span{font-size:13.5px;color:var(--muted)}
.big.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.big.primary span{color:inherit;opacity:.85}
.day7{display:flex;gap:6px;flex-wrap:wrap}
.day7 i{font-style:normal;font-size:12px;padding:4px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.day7 i.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:650}
.resume{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;cursor:pointer;text-align:start}
.resume div{flex:1;min-width:0}.resume b{display:block;font-size:15px}.resume span{font-size:13px;color:var(--muted)}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px}
details.more summary{cursor:pointer;padding:12px 0;font-weight:650;list-style:none;display:flex;justify-content:space-between}
details.more summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px;line-height:1}
details.more[open] summary::after{content:"−"}
.chumash{padding:6px 0 14px}
.chumash h3{margin:6px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 11px;cursor:pointer;font-family:var(--f-main);font-size:18px;line-height:1.2}
.chips button.cur{border-color:var(--accent);color:var(--accent)}
.foot{font-size:12px;color:var(--muted);line-height:1.6}

/* parsha picker sheet */
.pick{display:flex;flex-direction:column;gap:10px}
.pick .row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.pick .row{grid-template-columns:repeat(2,1fr)}}
.pick .row button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;cursor:pointer;font-weight:600}
.pick .row button.wide{grid-column:1/-1}

/* ---------- reader ---------- */
#reader main{padding-block:14px 120px}
.steps{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:4px 0 14px}
.steps i{font-style:normal;font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.steps i.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.steps i.past{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.alnav{display:flex;gap:6px;overflow-x:auto;direction:rtl;padding:2px 0 10px;scrollbar-width:none}
.alnav::-webkit-scrollbar{display:none}
.alnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:14px}
.alnav button.on{border-color:var(--accent);color:var(--accent);font-weight:650}
.alnav button.past{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.alhead{direction:rtl;text-align:center;margin:26px 0 14px;display:flex;align-items:center;gap:12px;color:var(--accent)}
.alhead::before,.alhead::after{content:"";flex:1;height:1px;background:var(--line)}
.alhead b{font-family:var(--f-main);font-weight:400;font-size:calc(var(--fs)*.8)}
.passlabel{direction:rtl;text-align:center;color:var(--muted);font-size:13px;margin:0 0 8px}

.flow{direction:rtl;text-align:justify;font-family:var(--f-main);font-size:var(--fs);line-height:2.05;max-width:36em;margin:0 auto;hyphens:none}
.flow.tg{font-family:var(--f-tg);color:var(--tg-ink);line-height:1.95}
.vn{font-family:var(--ui);font-size:.42em;color:var(--muted);opacity:.8;font-weight:600;vertical-align:.32em;margin-inline-end:.3em;user-select:none}
.ch{display:inline-block;font-family:var(--ui);font-size:.42em;font-weight:700;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:6px;padding:0 .45em;margin-inline-end:.35em;vertical-align:.45em;line-height:1.6}
.bp{display:block;height:.55em}
.bs{display:inline-block;width:2.4em}
.lg{font-size:1.4em;line-height:0}
.sm{font-size:.68em}
.ktv{font-size:.62em;color:var(--muted);font-family:var(--f-main)}
.v.tap{background:var(--hl);border-radius:4px}

.pv{max-width:46em;margin:0 auto;padding:14px 0 18px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.pv .ref{direction:rtl;font-size:12.5px;color:var(--accent);font-weight:650;letter-spacing:.02em}
.pv .mk{direction:rtl;text-align:justify;font-family:var(--f-main);font-size:var(--fs);line-height:2}
.pv .mk.rep{color:var(--rep-ink)}
body[data-rep="tint"] .pv .mk.rep{background:var(--rep-bg);border-radius:10px;padding:2px 12px}
body[data-rep="small"] .pv .mk.rep{font-size:calc(var(--fs)*.88)}
body[data-rep="bold"] .pv .mk.m1{font-weight:700}
body[data-rep="plain"] .pv .mk.rep{color:inherit}
.pv .tgx{direction:rtl;text-align:justify;font-family:var(--f-tg);font-size:calc(var(--fs)*.86);line-height:1.95;color:var(--tg-ink)}
.lbl{font-family:var(--ui);font-size:11px;color:var(--muted);font-weight:650;display:block;margin-bottom:1px;letter-spacing:.03em}
.rs{direction:rtl;text-align:justify;font-family:var(--f-rashi);font-size:calc(var(--fs)*.74);line-height:1.75;color:var(--ink)}
.rs p{margin:0 0 .35em}
.rs .dh{font-family:var(--f-main);font-weight:700}
.tgv{max-width:46em;margin:0 auto;padding:10px 0 14px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.tgv .ref{direction:rtl;font-size:12.5px;color:var(--accent);font-weight:650}
.tgv .tgx{direction:rtl;text-align:justify;font-family:var(--f-tg);font-size:var(--fs);line-height:1.95;color:var(--tg-ink)}
@media (min-width:900px){
  .pv.wide{max-width:none;grid-template-columns:1.2fr 1fr;column-gap:34px;direction:rtl;align-items:start}
  .pv.wide .ref{grid-column:1/-1}
  .pv.wide .colm{display:grid;gap:6px}
  .pv.wide .cols{display:grid;gap:10px;border-inline-start:1px solid var(--line);padding-inline-start:28px}
}
.pv .colm,.pv .cols{display:grid;gap:6px;min-width:0}

.next{display:flex;flex-direction:column;align-items:center;gap:10px;margin:34px auto 0;max-width:30em;text-align:center}
.next button.go1{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:16px 20px;font-size:18px;font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.next button.go1 svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.next .hint{font-size:13px;color:var(--muted)}
.next button.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;cursor:pointer}
.done{max-width:30em;margin:30px auto 0;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.done .chk{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.done .chk svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:2.4}
.done h3{margin:0;font-family:var(--f-main);font-weight:400;font-size:28px}
.done p{margin:0;color:var(--muted)}
.loading{text-align:center;color:var(--muted);padding:60px 0}

/* ---------- tikkun korim ---------- */
#tikkun .bar .wrap.row2{padding-block:0 10px;gap:10px;flex-wrap:wrap}
.seg3{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg3 button{border:0;background:none;padding:0 12px;height:36px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg3 button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tksize{display:flex;align-items:center;gap:8px;flex:1;min-width:180px}
.tksize input{flex:1;accent-color:var(--accent);min-width:0}
.tksize .a{font-family:var(--f-stam);color:var(--muted);border:0;background:none;cursor:pointer;line-height:1;padding:2px 4px}
#tkMain{padding-block:12px 90px}
.tkgrid{display:grid;gap:20px;justify-content:center}
.pane{min-width:0}
.scol{direction:rtl;background:var(--parch);color:var(--parch-ink);border:1px solid var(--parch-line);border-radius:6px;
  padding:1.1em 1.2em;font-size:var(--tfs);width:min(18.5em,100%);margin:0 auto;box-sizing:border-box}
.scol p{margin:0;text-align:justify;text-align-last:right;font-family:var(--f-stam);line-height:1.6;word-spacing:.08em}
.scol.v p{font-family:var(--f-stamv);line-height:2.25}
.scol .st{display:inline-block;width:4.4em}
.scol .sw{display:inline-block;width:2.6em}
.scol .lg{font-size:1.55em;line-height:0}
.scol .sm{font-size:.6em}
.w{cursor:pointer;border-radius:3px}
.w.hl{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.am{font-family:var(--ui);font-size:.36em;font-weight:700;color:var(--accent);vertical-align:.9em;margin-inline-end:.3em;letter-spacing:.02em;user-select:none}
.ptd{direction:rtl;font-family:var(--f-main);font-size:calc(var(--tfs)*.92);line-height:2.05;text-align:justify}
.ptd p{margin:0 0 .2em}
.ptd .alh{display:block;font-family:var(--ui);font-size:12.5px;font-weight:700;color:var(--accent);margin:1.2em 0 .2em;letter-spacing:.03em}
.ptd .ktv{font-size:.6em}
.tkchips{display:flex;gap:6px;overflow-x:auto;direction:rtl;padding:2px 0 12px;scrollbar-width:none;max-width:980px;margin:0 auto}
.tkchips::-webkit-scrollbar{display:none}
.tkchips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:14px}
.peek{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 10px 30px rgb(0 0 0 / .18);padding:10px 18px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:200px;max-width:calc(100% - 32px)}
.peek b{font-family:var(--f-main);font-weight:400;font-size:38px;line-height:1.6;direction:rtl}
.peek span{font-size:12.5px;color:var(--muted);direction:rtl}
.peek .pk-k{font-family:var(--f-main);font-size:15px}
@media (min-width:900px){
  .tkgrid.two{grid-template-columns:minmax(0,1fr) auto;direction:rtl;align-items:start;justify-content:stretch}
  .tkgrid.two .pane{max-height:calc(100dvh - 150px);overflow-y:auto;position:sticky;top:140px;padding-inline:4px}
  .tkgrid.two .pane.pt{padding-inline-end:22px;border-inline-end:1px solid var(--line)}
}
.tkgrid:not(.two) .pane.pt{display:none}
@media (min-width:900px){.tkgrid.two .scol{width:18.5em;max-width:58vw}}

/* ---------- settings sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .35);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none!important}
.panel{background:var(--surface);width:min(640px,100%);max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:20px;max-height:84%}}
.panel header{display:flex;align-items:center;justify-content:space-between}
.panel h2{margin:0;font-size:19px}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.k{font-size:13px;font-weight:650;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:650}
.opts button.font{font-size:19px;padding:6px 12px}
.preview{direction:rtl;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--bg)}
.preview .mk{font-family:var(--f-main);font-size:26px;line-height:2}
.preview .mk.rep{color:var(--rep-ink)}
body[data-rep="tint"] .preview .mk.rep{background:var(--rep-bg);border-radius:8px;padding:0 10px}
body[data-rep="small"] .preview .mk.rep{font-size:23px}
body[data-rep="bold"] .preview .mk.m1{font-weight:700}
body[data-rep="plain"] .preview .mk.rep{color:inherit}
.preview .tgx{font-family:var(--f-tg);font-size:22px;line-height:1.9;color:var(--tg-ink)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
@media (prefers-reduced-motion:no-preference){.big,.chips button,.next button.go1{transition:transform .12s ease}.big:active,.next button.go1:active{transform:scale(.985)}}
</style>

<div id="home">
  <div class="wrap">
    <div class="brand">
      <div><h1 id="appName">שנים מקרא ואחד תרגום</h1><small id="appSub"></small></div>
      <div style="display:flex;gap:8px;flex:none"><button class="ib langb" id="btnLang" aria-label="Language"></button>

<script>

'use strict';
/* ================= storage ================= */
const LS={get(k,d){try{const v=localStorage.getItem('smt:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},

const DEF={tkMode:'plain',tfs:26,tkTwo:true,lang:'he',il:false,mode:'sec',rep:'tint',font:'tf',tgFont:'td',rashi:false,rashiNikud:true,ketiv:true,taam:'tachton',skin:'auto',fs:28};
const S=Object.assign({},DEF,LS.get('prefs',{}));
// v2 defaults: Targum in Taamey David, Rashi with nikud
if(!(S.pv>=2)){S.tgFont='td';S.rashiNikud=true;S.pv=2;LS.set('prefs',S)}
const save=()=>LS.set('prefs',S);

/* ================= fonts ================= */
const FONTS={
  tf:{name:'Taamey Frank',fam:'TF',files:[['TaameyFrankCLM-Medium.ttf',400],['TaameyFrankCLM-Bold.ttf',700]]},
  td:{name:'Taamey David',fam:'TD',files:[['TaameyDavidCLM-Medium.ttf',400],['TaameyDavidCLM-Bold.ttf',700]]},
  fr:{name:'Frank Ruehl',fam:'FR',files:[['FrankRuehlCLM-Medium.otf',400],['FrankRuehlCLM-Bold.otf',700]]},
  dr:{name:'Drugulin',fam:'DR',files:[['DrugulinCLM-Bold.otf',400],['DrugulinCLM-Bold.otf',700]]},
  sm:{name:'Simple',fam:'SM',files:[['SimpleCLM-Medium.ttf',400]],noTrop:true},
  rashi:{name:'Rashi',fam:'RASHI',files:[['Mekorot-Rashi.ttf',400]]},
  stama:{name:'Stam Ashkenaz',fam:'STAMA',files:[['StamAshkenazCLM.ttf',400]]},
  stams:{name:'Shlomo Stam',fam:'STAMS',files:[['ShlomoStam.ttf',400]]}
};
const fontLoads={};
function loadFont(k){
  if(fontLoads[k]) return fontLoads[k];
  const F=FONTS[k];
  fontLoads[k]=Promise.all(F.files.map(([file,w])=>fetch('fonts/'+file).then(r=>{if(!r.ok)throw new Error(file);return r.arrayBuffer()})
    .then(buf=>{const ff=new FontFace(F.fam,buf,{weight:String(w)});document.fonts.add(ff);return ff.load()})))
    .catch(e=>console.warn('font',k,e));
  return fontLoads[k];
}
function applyFonts(){
  const m=FONTS[S.font]||FONTS.tf;
  const tg=S.tgFont==='same'?m:(FONTS[S.tgFont]||m);
  const r=document.documentElement.style;
  r.setProperty('--f-main',`"${m.fam}","TF","Times New Roman",serif`);
  r.setProperty('--f-tg',`"${tg.fam}","${m.fam}","TF","Times New Roman",serif`);
  loadFont('tf');loadFont(S.font);if(S.tgFont!=='same')loadFont(S.tgFont);
}
function applySkin(){const d=document.documentElement;if(S.skin==='auto')d.removeAttribute('data-skin');else d.setAttribute('data-skin',S.skin)}

/* ================= text helpers ================= */
const HEB_ONES=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],HEB_TENS=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],HEB_H=['','ק','ר','ש','ת'];
function gem(n,marks=true){let s='';let h=Math.floor(n/100);n%=100;while(h>4){s+='ת';h-=4}s+=HEB_H[h];
  if(n===15)s+='טו';else if(n===16)s+='טז';else s+=HEB_TENS[Math.floor(n/10)]+HEB_ONES[n%10];
  if(!marks)return s;return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳'}
const stripPts=s=>s.replace(/[֑-ׇ]/g,c=>c==='־'?c:'');
/* note: single-element ['S'] = setuma break; ['S',letter] = small letter */
function renderStream(st,o){
  let h='';
  for(const x of st){
    if(typeof x==='string'){h+=x;continue}
    const c=x[0];
    if(c==='S'&&x.length===1){h+=o.flow?'<span class="bs"></span>':' ';continue}
    if(c==='P'){h+=o.flow?'<span class="bp"></span>':' ';continue}
    if(c==='L'){h+=`<span class="lg">${x[1]}</span>`;continue}
    if(c==='S'){h+=`<span class="sm">${x[1]}</span>`;continue}
    if(c==='|'){h+=' ׀ ';continue}
    if(c==='l'){h+=' ׀';continue}
    if(c==='K'){h+=x[2]+(o.ketiv?` <span class="ktv">[${x[1]}]</span>`:'');continue}
    if(c==='C'){h+=renderStream(o.taam==='elyon'?x[1]:x[2],o);continue}
    if(c==='W'){h+=' &emsp; ';continue}
    if(c==='N'){h+='׆ ';continue}
  }
  return h;
}
const onkHTML=t=>t.replace(/\(([^)]*)\)/g,'<span class="ktv">($1)</span>');
function rashiHTML(list){
  return list.map(c=>{
    let t=c;
    if(!S.rashiNikud) t=stripPts(t);
    t=t.replace(/<b>(.*?)<\/b>/g,'<span class="dh">$1</span>');
    return `<p>${t}</p>`;
  }).join('');
}

/* ================= data ================= */
let META=null;const BK={};
const getJSON=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json()});
function book(b){if(!BK[b])BK[b]=Promise.all([getJSON(`data/t${b}.json`),getJSON(`data/o${b}.json`),getJSON(`data/r${b}.json`)]).then(([t,o,r])=>({t:t.c,o,r}));return BK[b]}
function versesOf(al){ // al=[b,c1,v1,c2,v2] -> list of [c,v]
  const [b,c1,v1,c2,v2]=al,out=[];
  for(let c=c1;c<=c2;c++){const n=META.books[b][c-1];for(let v=(c===c1?v1:1);v<=(c===c2?v2:n);v++)out.push([c,v])}
  return out;
}

   taam:'טעמי עשרת הדברות',tachton:'טעם תחתון',elyon:'טעם עליון',skin:'מראה',auto:'אוטומטי',light:'בהיר',sepia:'ספיה',dark:'כהה',

};
const L=()=>T[S.lang];
function pName(k){const p=META.parshiyot[k];return S.lang==='he'?p.he:p.en}
function alNames(idx){const a=L().al;return idx.length===1?a[idx[0]]:idx.slice(0,-1).map(i=>a[i]).join(', ')+L().and+a[idx[idx.length-1]]}

/* ================= calendar ================= */
const ymd=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
function thisWeek(now=new Date()){
  const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  d.setDate(d.getDate()+((6-d.getDay()+7)%7));
  const cal=META.cal[S.il?'i':'d'];
  for(let i=0;i<5;i++){const e=cal[ymd(d)];if(e)return{key:e[0],heDate:e[1],enDate:e[2],date:new Date(d),bump:i>0};d.setDate(d.getDate()+7)}
  return null;
}
function todayIdx(dow){return dow===6?[0,1,2,3,4,5,6]:dow===5?[5,6]:[dow]}

/* ================= state & routing ================= */
let SESSION=null; // {key, idx:[aliyah indexes], kind, pos:{ai,pass}}
const $=id=>document.getElementById(id);
function show(view){$('home').hidden=view!=='home';$('reader').hidden=view!=='reader';$('tikkun').hidden=view!=='tikkun';if(view!=='tikkun')$('peek').hidden=true}
function go(hash){if(location.hash!=='#'+hash)location.hash=hash;else route()}
window.addEventListener('hashchange',route);
function route(){
  const h=location.hash.slice(1);
  closeSheets(true);
  if(h==='read'&&SESSION){show('reader');renderReader(false)}
  else if(h==='tikkun'&&TK){show('tikkun');renderTikkun()}
  else{show('home');renderHome()}
}

/* ================= home ================= */
function renderHome(){
  const l=L();document.documentElement.lang=S.lang;document.body.dir=S.lang==='he'?'rtl':'ltr';
  $('appName').textContent=S.lang==='he'?'שנים מקרא ואחד תרגום':'Shnayim Mikra';
  $('appSub').textContent=l.sub;
  $('btnLang').textContent=S.lang==='he'?'EN':'עב';$('btnLang').setAttribute('aria-label',S.lang==='he'?'Switch to English':'לעברית');
  const wk=thisWeek();
  if(!wk){$('wkName').textContent='—';return}
  const dow=new Date().getDay();
  $('wkEyebrow').textContent=l.week;
  $('wkName').textContent=(S.lang==='he'?'פרשת ':'')+META.parshiyot[wk.key].he;
  $('wkDate').textContent=(S.lang==='he'?l.wkOf+' '+wk.heDate:l.wkOf+', '+wk.date.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+wk.enDate)+(S.lang==='en'?' · '+META.parshiyot[wk.key].en:'');
  // day chips: which aliyah each weekday gets
  const chips=[0,1,2,3,4,5].map(d=>{const idx=todayIdx(d);return `<i class="${!wk.bump&&d===dow?'on':''}">${l.dshort[d]} · ${alNames(idx)}</i>`});
  $('wkDays').innerHTML=chips.join('');
  const idx=wk.bump?[0]:todayIdx(dow);
  $('tdTitle').textContent=l.today;
  $('tdSub').textContent=wk.bump?l.tdLabel(l.days[0],l.al[0]):dow===6?l.shabbos:l.tdLabel(l.days[dow],alNames(idx));
  $('btnToday').onclick=()=>start(wk.key,idx,dow===6&&!wk.bump?'full':'today');
  $('fullTitle').textContent=l.full;$('fullSub').textContent=l.fullSub;
  $('btnFull').onclick=()=>start(wk.key,[0,1,2,3,4,5,6],'full');
  $('oneTitle').textContent=l.one;$('oneSub').textContent=l.oneSub;
  $('btnOne').onclick=()=>pickAliyah(wk.key);
  $('tkTitle').textContent=l.tikkun;$('tkSub').textContent=l.tikkunSub;
  $('btnTk').onclick=()=>openTikkun(wk.key,0);
  // resume
  const r=LS.get('pos',null);
  if(r&&META.parshiyot[r.key]){
    $('btnResume').hidden=false;$('rsTitle').textContent=l.resume;
    const a=r.idx[r.pos.ai];
    $('rsSub').textContent=pName(r.key)+' · '+l.al[a]+(r.mode==='sec'?' · '+[l.mikra1,l.mikra2,l.targum][r.pos.pass]:'');
    $('btnResume').onclick=()=>{SESSION=r;go('read')};
  }else $('btnResume').hidden=true;
  // all parshiyot
  $('moreTitle').textContent=l.more;
  const byBook=[[],[],[],[],[]];
  for(const k of META.order){byBook[META.parshiyot[k].aliyot[0][0]].push(k)}
  const combos=Object.keys(META.parshiyot).filter(k=>!META.order.includes(k));

function renderSection(main,P,B,o){
  const l=L(),s=SESSION,{ai,pass}=s.pos,a=s.idx[ai],al=P.aliyot[a],b=al[0],bk=B[b];
  $('rdSub').textContent=l.al[a]+' · '+[l.mikra1+' א׳',l.mikra2,l.targum][pass].replace(' א׳',S.lang==='he'?' א׳':' 1');

    });

let TK=null; // {key, al}
function tokenize(st,taam,out){
  out=out||[];let cur=null;
  const flush=()=>{if(cur&&cur.p.length)out.push(cur);cur=null};
  const lastW=()=>{for(let i=out.length-1;i>=0;i--)if(out[i].t==='w')return out[i];return null};
  for(const x of st){
    if(typeof x==='string'){
      for(const part of x.split(/([ ־])/)){
        if(part===' ')flush();
        else if(part==='־'){if(cur)cur.mq=true;flush()}
        else if(part){if(!cur)cur={t:'w',p:[]};cur.p.push([part,''])}
      }
      continue;
    }
    const c=x[0];
    if((c==='L'||c==='S')&&x.length===2){if(!cur)cur={t:'w',p:[]};cur.p.push([x[1],c==='L'?'lg':'sm']);continue}
    if(c==='|'||c==='l'){flush();const w=lastW();if(w)w.ps=true;continue}
    if(c==='K'){flush();out.push({t:'w',p:[[x[2],'']],k:x[1]});continue}
    if(c==='C'){flush();tokenize(taam==='elyon'?x[1]:x[2],taam,out);continue}
    flush();out.push({t:c==='S'?'S':c});   // P, S(etuma), W, N
  }
  flush();return out;
}
const RX_ALL=/[֑-ׇ]/g, RX_TROP=/[֑-ֽ֯׀׃]/g;
function stamWord(w,mode){
  const conv=s=>mode==='plain'?s.replace(RX_ALL,''):mode==='nikud'?s.replace(RX_TROP,''):s;
  if(w.k&&mode==='plain')return w.k;
  return w.p.map(([s,cls])=>cls?`<span class="${cls}">${conv(s)}</span>`:conv(s)).join('')+(mode!=='plain'&&w.mq?'־':'');
}
function ptWord(w){return w.p.map(([s,cls])=>cls?`<span class="${cls}">${s}</span>`:s).join('')+(w.ps?' ׀':'')+(w.k&&S.ketiv?` <span class="ktv">[${w.k}]</span>`:'')}

   <div class="field"><span class="k">${l.font}</span>${optRow('font',['tf','td','fr','dr'].map(k=>[k,FONTS[k].name,`font-family:"${FONTS[k].fam}",serif;font-size:16px`]))}</div>
   <div class="field"><span class="k">${l.tgFont}</span>${optRow('tgFont',[['same',l.same],...['tf','td','fr','dr','sm'].map(k=>[k,FONTS[k].name,`font-family:"${FONTS[k].fam}",serif;font-size:16px`])])}</div>
   <div class="field"><span class="k">${l.rep}</span>${optRow('rep',[['tint',l.repTint],['small',l.repSmall],['bold',l.repBold],['plain',l.repPlain]])}
     <div class="preview" id="pv"></div></div>
   <div class="field"><span class="k">${l.rashiNik}</span>${optRow('rashiNikud',[[false,l.off],[true,l.on]])}<p class="note">${l.rashiNote}</p></div>
   <div class="field"><span class="k">${l.ketiv}</span>${optRow('ketiv',[[true,l.on],[false,l.off]])}</div>
   <div class="field"><span class="k">${l.taam}</span>${optRow('taam',[['tachton',l.tachton],['elyon',l.elyon]])}</div>
   <div class="field"><span class="k">${l.skin}</span>${optRow('skin',[['auto',l.auto],['light',l.light],['sepia',l.sepia],['dark',l.dark]])}</div>`;
  book(0).then(bk=>{const t=renderStream(bk.t[0][0].s,{taam:S.taam,ketiv:false});
    $('pv').innerHTML=`<div class="mk m1">${t}</div><div class="mk rep">${t}</div><div class="tgx">${bk.o[0][0]}</div>`});
  $('prefsBody').querySelectorAll('.opts').forEach(row=>row.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const k=row.dataset.key;let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;
    S[k]=v;save();applyAll();
    row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    if(k==='lang')renderPrefs();
    if(k==='mode'&&SESSION){SESSION.pos.pass=0;SESSION.pos.anchor=null}
    if(!$('reader').hidden)renderReader(false);else if(!$('tikkun').hidden)renderTikkun();else renderHome();
  }));
}
function applyAll(){applyFonts();applySkin();document.body.dataset.rep=S.rep;setFs(S.fs)}

/* ================= boot ================= */
applyAll();
getJSON('data/meta.json').then(m=>{META=m;
  if(location.hash==='#read'){const r=LS.get('pos',null);if(r)SESSION=r;else location.hash='home'}
  if(location.hash==='#tikkun'){TK=LS.get('tk',null);if(!TK)location.hash='home'}
  route();
}).catch(e=>{document.getElementById('wkName').textContent='Could not load data';console.error(e)});
})();
</script>
